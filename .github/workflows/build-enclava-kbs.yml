name: Build and Push Enclava Trustee Runtime Images

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version_tag:
        description: "Optional additional image tag to publish, for example v0.1.0-enclava.1"
        required: false
        type: string

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  build-runtime:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: KBS
            dockerfile: kbs/docker/coco-as-grpc/Dockerfile
            build_args: --build-arg BUILDPLATFORM=linux/amd64 --build-arg ARCH=x86_64
            image: ghcr.io/enclava-labs/trustee-kbs-grpc-as
            digest_file: kbs-image-digest.txt
            artifact: trustee-kbs-image-digest
          - component: AS
            dockerfile: attestation-service/docker/as-grpc/Dockerfile
            build_args: --build-arg BUILDPLATFORM=linux/amd64 --build-arg ARCH=x86_64 --build-arg VERIFIER=all-verifier
            image: ghcr.io/enclava-labs/trustee-as-grpc
            digest_file: as-image-digest.txt
            artifact: trustee-as-image-digest
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Login to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image tag
        id: tag
        env:
          VERSION_TAG: ${{ github.event.inputs.version_tag }}
        run: |
          if [ -n "${VERSION_TAG}" ]; then
            echo "tag=${VERSION_TAG}" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push ${{ matrix.component }} image
        id: image
        run: |
          docker buildx build --provenance false \
            --platform linux/amd64 \
            -f "${{ matrix.dockerfile }}" \
            ${{ matrix.build_args }} \
            --push \
            --metadata-file /tmp/image-metadata.json \
            -t "${{ matrix.image }}:${{ steps.tag.outputs.tag }}" \
            -t "${{ matrix.image }}:latest" \
            .

          digest="$(jq -r '."containerimage.digest"' /tmp/image-metadata.json)"
          if ! [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "valid containerimage.digest missing from build metadata"
            exit 1
          fi
          image_ref="${{ matrix.image }}@${digest}"
          printf '%s\n' "${image_ref}" > "${{ matrix.digest_file }}"
          echo "ref=${image_ref}" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2

      - name: Sign pushed digest
        run: cosign sign --yes "${{ steps.image.outputs.ref }}"

      - name: Verify pushed digest signature
        run: >-
          cosign verify
          --certificate-identity "https://github.com/${GITHUB_WORKFLOW_REF}"
          --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
          "${{ steps.image.outputs.ref }}"

      - name: Upload verified immutable image reference
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ${{ matrix.artifact }}-${{ github.sha }}
          path: ${{ matrix.digest_file }}
          if-no-files-found: error
          retention-days: 90
